; Shared settings for the flight controller hardware targets.
[fc]
framework = arduino
lib_deps = greiman/SdFat@2.2.3
; Strict flags only for our own sources, the vendor cores don't build warning-free.
build_src_flags =
    -Wall
    -Wextra
    -fno-exceptions
    -fno-rtti
monitor_speed = 460800

; Each env compiles only its own board folder, so board differences need no #ifdef.
[env:esp32s3]
extends = fc
; Pinned: arduino-esp32 v3 renamed the LEDC API, newer releases may rename more.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
board = esp32-s3-devkitc-1
build_src_filter = +<*> -<board/> +<board/esp32s3/>
upload_port = COM3
monitor_port = COM3

[env:bluepill]
extends = fc
platform = ststm32@19.0.0
; Most C8 chips have 128 KB flash, the 64 KB layout is too small with SdFat.
board = bluepill_f103c8_128k
board_build.f_cpu = 72000000L
build_src_filter = +<*> -<board/> +<board/stm32f103/>
; Default 64-byte UART buffers overflow on CRSF bursts and debug output.
; --wrap=_sbrk routes heap growth through the heap guard in board/stm32f103/board.cpp.
build_flags =
    -D SERIAL_RX_BUFFER_SIZE=256
    -D SERIAL_TX_BUFFER_SIZE=256
    -Wl,--wrap=_sbrk
upload_protocol = serial
upload_port = COM3
monitor_port = COM3

; Unit tests for the pure logic in lib/, run on the PC: pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags =
    -Wall
    -Wextra
